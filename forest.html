<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Shrouded Forest</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0b0f0c;
      font-family: "Courier New", monospace;
      color: #cce7d0;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Mist layer */
    .mist {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://raw.githubusercontent.com/25jgoldie-eng/Puzzle-Island365/main/fog.png');
      opacity: 0.7;
      animation: drift 20s infinite linear;
      pointer-events: none;
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-300px); }
    }

    .content {
      position: relative;
      z-index: 2;
      padding: 40px;
      max-width: 700px;
    }

    .btn {
      margin-top: 20px;
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid #cce7d0;
      color: #cce7d0;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:hover {
      background: #cce7d0;
      color: #0b0f0c;
    }
  </style>
</head>
<body>

<div class="content">
  <h2>SHROUDED FOREST</h2>
  <p>The trees tower above you, their shapes barely visible through the rolling mist.  
  Every direction looks the same — trunks, shadows, silence.</p>

  <p>Something moves far off in the fog.  
  Or maybe the fog itself is moving.</p>

  <a class="btn" href="escape.html">Return to Map</a>
</div>

<div class="mist"></div>

</body>
</html>
