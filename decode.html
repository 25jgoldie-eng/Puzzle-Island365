<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Decoded Output</title>
  <style>
    body {
      background: #050608;
      color: #00ff9c;
      font-family: "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .terminal {
      border: 1px solid #00ff9c;
      padding: 20px 30px;
      max-width: 600px;
    }
    .code {
      font-size: 26px;
      letter-spacing: 4px;
      margin-top: 10px;
    }
    .note {
      margin-top: 15px;
      font-size: 13px;
      color: #7cffc8;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <pre>DECODE COMPLETE
----------------</pre>
    <div>Decoded output:</div>
    <div class="code">46809</div>
    <div class="note">
      Field note (auto-logged):<br>
      "Five digits. Looks like a physical access code."
    </div>
  </div>
</body>
</html>
