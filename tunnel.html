  <h2>OLD TUNNEL ENTRANCE</h2>
  <p>The air grows colder as you approach the tunnel mouth.

  <p>A warning is scratched into the stone:</p>

  DO NOT ENTER  
  UNTIL THE ISLAND SLEEPS
